<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" width="100%" height="100%">
  <defs>
    <!-- Primary Champagne-to-Amber Gold Metallic Gradient for "Frag" -->
    <linearGradient id="goldGradientFrag" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="18%" stop-color="#F6DC9F" />
      <stop offset="38%" stop-color="#E2B762" />
      <stop offset="58%" stop-color="#FCE1A2" />
      <stop offset="78%" stop-color="#B8832A" />
      <stop offset="92%" stop-color="#E7BF6D" />
      <stop offset="100%" stop-color="#9C6B1B" />
    </linearGradient>

    <!-- Rich Honey & Burnished Gold Gradient for "Dealz" -->
    <linearGradient id="goldGradientDealz" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#F8DF9E" />
      <stop offset="20%" stop-color="#E5AF4A" />
      <stop offset="42%" stop-color="#C57E19" />
      <stop offset="60%" stop-color="#FCE5A9" />
      <stop offset="75%" stop-color="#E4AD45" />
      <stop offset="90%" stop-color="#9B5F0D" />
      <stop offset="100%" stop-color="#E8BE68" />
    </linearGradient>

    <!-- Bevel Specular Top Highlight -->
    <linearGradient id="bevelSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#FFEBB8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#6E4407" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFE8B0" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Depth Drop Shadow -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#5A3A05" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,700;1,6..96,600&amp;family=Cormorant+Garamond:wght@600;700&amp;display=swap');
    .logo-frag {
      font-family: 'Bodoni Moda', 'Cormorant Garamond', 'Didot', 'Playfair Display', serif;
      font-size: 138px;
      font-weight: 700;
      letter-spacing: -2px;
      fill: url(#goldGradientFrag);
    }
    .logo-dealz {
      font-family: 'Bodoni Moda', 'Cormorant Garamond', 'Didot', 'Playfair Display', serif;
      font-size: 142px;
      font-weight: 700;
      letter-spacing: -3.5px;
      fill: url(#goldGradientDealz);
    }
  </style>

  <!-- Group with subtle metallic depth shadow -->
  <g filter="url(#subtleGlow)">
    <!-- Main Typography matching the exact luxury serif contours of the uploaded logo -->
    <text x="18" y="128" class="logo-frag">Frag<tspan class="logo-dealz">Dealz</tspan></text>
  </g>
</svg>
